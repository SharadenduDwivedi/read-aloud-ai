<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>

  <!-- ============================================================ -->
  <!-- 1. PASTE YOUR DESTINATION LINK BELOW IN BOTH PLACES          -->
  <!-- ============================================================ -->
  
  <!-- Fast Meta Refresh (runs immediately on HTML load) -->
  <meta id="meta-refresh" http-equiv="refresh" content="0; url=https://example.com">

  <script>
    // 2. PASTE YOUR DESTINATION LINK HERE:
    const TARGET_URL = "https://example.com";

    // Immediate JavaScript redirection
    if (TARGET_URL && TARGET_URL !== "https://example.com") {
      window.location.replace(TARGET_URL);
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      padding: 36px 32px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 20px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      transition: background-color 0.15s ease;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Redirecting...</h2>
    <p>We are taking you to our new page. If you are not redirected automatically within a few seconds, click the button below:</p>
    <a id="btn-redirect" class="btn" href="https://example.com">Go to new page &rarr;</a>
  </div>

  <script>
    // Keep button and meta tag synchronized with TARGET_URL
    if (TARGET_URL && TARGET_URL !== "https://example.com") {
      document.getElementById("btn-redirect").href = TARGET_URL;
      document.getElementById("meta-refresh").content = "0; url=" + TARGET_URL;
      window.location.replace(TARGET_URL);
    }
  </script>
</body>
</html>
